<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="620" viewBox="0 0 1600 620" role="img" aria-labelledby="title desc">
  <title id="title">IEEE Research Skills</title>
  <desc id="desc">A traceable workflow from literature review to IEEE submission.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#071936"/><stop offset="0.58" stop-color="#0b2d5f"/><stop offset="1" stop-color="#0d4f8f"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#60a5fa"/><stop offset="1" stop-color="#22d3ee"/></linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="12" stdDeviation="18" flood-color="#020617" flood-opacity="0.32"/></filter>
  </defs>
  <rect width="1600" height="620" rx="34" fill="url(#bg)"/>
  <circle cx="1390" cy="-20" r="330" fill="#38bdf8" opacity="0.08"/><circle cx="1190" cy="650" r="290" fill="#818cf8" opacity="0.09"/>
  <path d="M0 520 C280 430 440 610 730 510 S1260 430 1600 520 V620 H0Z" fill="#0ea5e9" opacity="0.08"/>
  <g font-family="Inter, Segoe UI, Microsoft YaHei, Arial, sans-serif">
    <g transform="translate(92 94)">
      <rect width="76" height="8" rx="4" fill="url(#accent)"/>
      <text x="0" y="82" font-size="62" font-weight="760" fill="#f8fafc">IEEE Research Skills</text>
      <text x="0" y="136" font-size="27" font-weight="500" fill="#bae6fd">从文献调研到投稿的可追溯科研工作流</text>
      <text x="0" y="200" font-size="20" fill="#cbd5e1">面向通信、信号处理及相邻工程学科</text>
      <g transform="translate(0 252)">
        <rect width="470" height="76" rx="18" fill="#ffffff" opacity="0.08" stroke="#93c5fd" stroke-opacity="0.35"/>
        <circle cx="38" cy="38" r="16" fill="#38bdf8"/><path d="M30 38l6 6 11-14" fill="none" stroke="#06244c" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
        <text x="70" y="32" font-size="17" font-weight="650" fill="#e0f2fe">Local-first · Evidence-traceable</text>
        <text x="70" y="56" font-size="15" fill="#a8c6e8">关键结论、代码、公式与版本均可回溯</text>
      </g>
      <text x="0" y="402" font-size="16" fill="#93c5fd">LITERATURE · MODEL · SIMULATION · MANUSCRIPT · REVIEW · SUBMISSION</text>
    </g>
    <g transform="translate(875 90)" filter="url(#shadow)">
      <rect width="620" height="440" rx="28" fill="#ffffff" opacity="0.97"/>
      <text x="42" y="58" font-size="18" font-weight="700" fill="#0f2f5f">RESEARCH PIPELINE</text>
      <text x="42" y="86" font-size="15" fill="#64748b">Deliverable-level confirmation at every handoff</text>
      <path d="M102 156 H518 M102 258 H518 M102 360 H518" stroke="#dbeafe" stroke-width="5" stroke-linecap="round"/>
      <g transform="translate(56 120)"><circle cx="46" cy="36" r="35" fill="#dbeafe"/><path d="M32 20h22a7 7 0 017 7v27H32z M38 30h17 M38 39h17 M38 48h12" fill="none" stroke="#2563eb" stroke-width="3" stroke-linecap="round"/><text x="96" y="31" font-size="20" font-weight="700" fill="#183b6b">文献调研</text><text x="96" y="54" font-size="14" fill="#64748b">证据卡 · 缺口验证</text></g>
      <g transform="translate(350 120)"><circle cx="46" cy="36" r="35" fill="#cffafe"/><text x="46" y="45" text-anchor="middle" font-size="31" font-family="Georgia, serif" font-weight="700" fill="#0891b2">Σ</text><text x="96" y="31" font-size="20" font-weight="700" fill="#183b6b">模型与推导</text><text x="96" y="54" font-size="14" fill="#64748b">定义 · 维度 · 可行性</text></g>
      <g transform="translate(56 222)"><circle cx="46" cy="36" r="35" fill="#dcfce7"/><path d="M27 50V35 M40 50V25 M53 50V31 M66 50V18" fill="none" stroke="#16a34a" stroke-width="5" stroke-linecap="round"/><text x="96" y="31" font-size="20" font-weight="700" fill="#183b6b">仿真与结果</text><text x="96" y="54" font-size="14" fill="#64748b">版本 · 基线 · 图表证据</text></g>
      <g transform="translate(350 222)"><circle cx="46" cy="36" r="35" fill="#ede9fe"/><path d="M29 50l7-20 21-12 8 8-12 21-20 7z M53 29l8 8" fill="none" stroke="#7c3aed" stroke-width="3.5" stroke-linejoin="round"/><text x="96" y="31" font-size="20" font-weight="700" fill="#183b6b">论文撰写</text><text x="96" y="54" font-size="14" fill="#64748b">IEEE prose · LaTeX</text></g>
      <g transform="translate(56 324)"><circle cx="46" cy="36" r="35" fill="#ffedd5"/><path d="M28 37l11 11 25-28" fill="none" stroke="#ea580c" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/><text x="96" y="31" font-size="20" font-weight="700" fill="#183b6b">审阅与修改</text><text x="96" y="54" font-size="14" fill="#64748b">批注 · 复核 · 处置记录</text></g>
      <g transform="translate(350 324)"><circle cx="46" cy="36" r="35" fill="#fee2e2"/><path d="M46 53V20 M33 32l13-12 13 12 M30 54h32" fill="none" stroke="#dc2626" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/><text x="96" y="31" font-size="20" font-weight="700" fill="#183b6b">投稿检查</text><text x="96" y="54" font-size="14" fill="#64748b">一致性 · 可复现性</text></g>
    </g>
  </g>
