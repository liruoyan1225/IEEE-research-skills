<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">IEEE Research Skills 工作流总览</title>
  <desc id="desc">六阶段科研工作流：调研、研究文档、仿真、论文撰写、初稿修改和投稿。工作台索引贯穿全部阶段。</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#071936"/>
      <stop offset="0.56" stop-color="#0b2d5f"/>
      <stop offset="1" stop-color="#0d4f8f"/>
    </linearGradient>
    <linearGradient id="indexBand" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#0f3d75"/>
      <stop offset="1" stop-color="#075985"/>
    </linearGradient>
    <filter id="cardShadow" x="-15%" y="-20%" width="130%" height="150%">
      <feDropShadow dx="0" dy="12" stdDeviation="15" flood-color="#020617" flood-opacity="0.28"/>
    </filter>
    <marker id="arrow" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="10" markerHeight="10" orient="auto-start-reverse">
      <path d="M1 1L11 6L1 11Z" fill="#7dd3fc"/>
    </marker>
  </defs>

  <rect width="1600" height="900" rx="32" fill="url(#background)"/>
  <circle cx="1490" cy="50" r="260" fill="#38bdf8" opacity="0.07"/>
  <circle cx="80" cy="860" r="250" fill="#818cf8" opacity="0.06"/>

  <g font-family="Inter, Segoe UI, Microsoft YaHei, Arial, sans-serif">
    <rect x="88" y="70" width="78" height="8" rx="4" fill="#38bdf8"/>
    <text x="88" y="126" font-size="40" font-weight="760" fill="#f8fafc">一条主线，六个阶段</text>
    <text x="88" y="164" font-size="22" fill="#bae6fd">允许回退，但每次回退都要记录变更内容与复检范围</text>

    <g fill="none" stroke="#7dd3fc" stroke-width="7" stroke-linecap="round">
      <path d="M510 300H575" marker-end="url(#arrow)"/>
      <path d="M1010 300H1075" marker-end="url(#arrow)"/>
      <path d="M1300 410V478" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
      <path d="M1090 620H1025" marker-end="url(#arrow)"/>
      <path d="M590 620H525" marker-end="url(#arrow)"/>
    </g>
    <g font-size="17" font-weight="700" fill="#bae6fd">
      <text x="532" y="281">交付</text>
      <text x="1032" y="281">确认</text>
      <text x="1335" y="451">迭代</text>
      <text x="1032" y="602">修改</text>
      <text x="532" y="602">复核</text>
    </g>

    <g transform="translate(90 190)" filter="url(#cardShadow)">
      <rect width="420" height="220" rx="26" fill="#ffffff" fill-opacity="0.97" stroke="#93c5fd" stroke-width="3"/>
      <circle cx="62" cy="66" r="34" fill="#2563eb"/>
      <text x="62" y="76" text-anchor="middle" font-size="26" font-weight="800" fill="#ffffff">01</text>
      <text x="116" y="62" font-size="34" font-weight="760" fill="#173b6c">调研</text>
      <text x="116" y="98" font-size="23" fill="#475569">文献证据 · 缺口验证</text>
      <path d="M34 130H386" stroke="#dbeafe" stroke-width="2"/>
      <text x="38" y="171" font-size="20" font-weight="650" fill="#2563eb">输出</text>
      <text x="98" y="171" font-size="20" fill="#334155">调研证据卡与待核实项</text>
    </g>

    <g transform="translate(590 190)" filter="url(#cardShadow)">
      <rect width="420" height="220" rx="26" fill="#ffffff" fill-opacity="0.97" stroke="#67e8f9" stroke-width="3"/>
      <circle cx="62" cy="66" r="34" fill="#0891b2"/>
      <text x="62" y="76" text-anchor="middle" font-size="26" font-weight="800" fill="#ffffff">02</text>
      <text x="116" y="62" font-size="34" font-weight="760" fill="#173b6c">研究文档</text>
      <text x="116" y="98" font-size="23" fill="#475569">问题定义 · 模型推导</text>
      <path d="M34 130H386" stroke="#cffafe" stroke-width="2"/>
      <text x="38" y="171" font-size="20" font-weight="650" fill="#0891b2">输出</text>
      <text x="98" y="171" font-size="20" fill="#334155">研究方案与公式检查</text>
    </g>

    <g transform="translate(1090 190)" filter="url(#cardShadow)">
      <rect width="420" height="220" rx="26" fill="#ffffff" fill-opacity="0.97" stroke="#86efac" stroke-width="3"/>
      <circle cx="62" cy="66" r="34" fill="#16a34a"/>
      <text x="62" y="76" text-anchor="middle" font-size="26" font-weight="800" fill="#ffffff">03</text>
      <text x="116" y="62" font-size="34" font-weight="760" fill="#173b6c">仿真</text>
      <text x="116" y="98" font-size="23" fill="#475569">配置 · 代码 · 结果证据</text>
      <path d="M34 130H386" stroke="#dcfce7" stroke-width="2"/>
      <text x="38" y="171" font-size="20" font-weight="650" fill="#16a34a">输出</text>
      <text x="98" y="171" font-size="20" fill="#334155">可复现的结果链</text>
    </g>

    <g transform="translate(1090 510)" filter="url(#cardShadow)">
      <rect width="420" height="220" rx="26" fill="#ffffff" fill-opacity="0.97" stroke="#c4b5fd" stroke-width="3"/>
      <circle cx="62" cy="66" r="34" fill="#7c3aed"/>
      <text x="62" y="76" text-anchor="middle" font-size="26" font-weight="800" fill="#ffffff">04</text>
      <text x="116" y="62" font-size="34" font-weight="760" fill="#173b6c">论文撰写</text>
      <text x="116" y="98" font-size="23" fill="#475569">IEEE 稿件 · LaTeX</text>
      <path d="M34 130H386" stroke="#ede9fe" stroke-width="2"/>
      <text x="38" y="171" font-size="20" font-weight="650" fill="#7c3aed">输出</text>
      <text x="98" y="171" font-size="20" fill="#334155">可核查的稿件版本</text>
    </g>

    <g transform="translate(590 510)" filter="url(#cardShadow)">
      <rect width="420" height="220" rx="26" fill="#ffffff" fill-opacity="0.97" stroke="#fdba74" stroke-width="3"/>
      <circle cx="62" cy="66" r="34" fill="#ea580c"/>
      <text x="62" y="76" text-anchor="middle" font-size="26" font-weight="800" fill="#ffffff">05</text>
      <text x="116" y="62" font-size="34" font-weight="760" fill="#173b6c">初稿修改</text>
      <text x="116" y="98" font-size="23" fill="#475569">导师批注 · 逐条处置</text>
      <path d="M34 130H386" stroke="#ffedd5" stroke-width="2"/>
      <text x="38" y="171" font-size="20" font-weight="650" fill="#ea580c">输出</text>
      <text x="98" y="171" font-size="20" fill="#334155">修改记录与复检结果</text>
    </g>

    <g transform="translate(90 510)" filter="url(#cardShadow)">
      <rect width="420" height="220" rx="26" fill="#ffffff" fill-opacity="0.97" stroke="#fca5a5" stroke-width="3"/>
      <circle cx="62" cy="66" r="34" fill="#dc2626"/>
      <text x="62" y="76" text-anchor="middle" font-size="26" font-weight="800" fill="#ffffff">06</text>
      <text x="116" y="62" font-size="34" font-weight="760" fill="#173b6c">投稿</text>
      <text x="116" y="98" font-size="23" fill="#475569">一致性 · 引用 · 可复现性</text>
      <path d="M34 130H386" stroke="#fee2e2" stroke-width="2"/>
      <text x="38" y="171" font-size="20" font-weight="650" fill="#dc2626">输出</text>
      <text x="98" y="171" font-size="20" fill="#334155">投稿前检查单</text>
    </g>

    <path d="M300 730V770M800 730V770M1300 730V770" fill="none" stroke="#67e8f9" stroke-width="3" stroke-dasharray="8 9" opacity="0.8"/>
    <g transform="translate(90 770)">
      <rect width="1420" height="86" rx="24" fill="url(#indexBand)" stroke="#67e8f9" stroke-opacity="0.65" stroke-width="2"/>
      <text x="38" y="54" font-size="29" font-weight="760" fill="#f8fafc">工作台索引</text>
      <text x="260" y="54" font-size="22" fill="#bae6fd">贯穿全部阶段，统一记录</text>
      <g font-size="20" font-weight="650" fill="#e0f2fe">
        <rect x="590" y="20" width="130" height="48" rx="15" fill="#ffffff" opacity="0.11"/><text x="655" y="51" text-anchor="middle">状态</text>
        <rect x="744" y="20" width="130" height="48" rx="15" fill="#ffffff" opacity="0.11"/><text x="809" y="51" text-anchor="middle">确认</text>
        <rect x="898" y="20" width="130" height="48" rx="15" fill="#ffffff" opacity="0.11"/><text x="963" y="51" text-anchor="middle">版本</text>
        <rect x="1052" y="20" width="150" height="48" rx="15" fill="#ffffff" opacity="0.11"/><text x="1127" y="51" text-anchor="middle">证据链</text>
        <rect x="1226" y="20" width="156" height="48" rx="15" fill="#ffffff" opacity="0.11"/><text x="1304" y="51" text-anchor="middle">待确认项</text>
      </g>
    </g>
  </g>
</svg>
